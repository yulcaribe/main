<header class="site-header">
  <div class="shell header-inner">
    <a class="brand" href="/" aria-label="YulCaribe ana sayfa">YulCaribe</a>

    <nav class="top-nav" aria-label="Ana menü">
      <a href="#weather">METAR / TAF</a>
      <a href="/main/briefing/">Pilot Brief <span>↗</span></a>\n      <a href="/main/notam/">NOTAM <span>↗</span></a>
      <a class="map-nav" href="/main/map/?mode=flights">Live Map <span>↗</span></a>
    </nav>
  </div>
</header>

<main id="top">
  <section class="hero-section">
    <div class="shell hero">
      <h1>YulCaribe</h1>

      <div class="hero-actions">
        <a class="primary-button" href="/main/map/?mode=flights">Live Map <span>↗</span></a>
        <a class="secondary-button" href="/main/briefing/">Pilot Brief <span>↗</span></a>\n        <a class="secondary-button" href="/main/notam/">NOTAM <span>↗</span></a>
        <a class="secondary-button" href="#weather">METAR / TAF <span>↓</span></a>
      </div>
    </div>
  </section>

  <section class="weather-section" id="weather">
    <div class="shell weather-wrap">
      <div class="weather-head">
        <h2>METAR / TAF</h2>
        <div class="weather-language" role="group" aria-label="Yorum dili">
          <button type="button" data-weather-language="tr" aria-pressed="true">TR</button>
          <button type="button" data-weather-language="en" aria-pressed="false">EN</button>
        </div>
      </div>

      <form class="weather-search" id="weather-search-form" autocomplete="off">
        <div class="weather-search-field">
          <input
            id="weather-icao"
            name="icao"
            type="text"
            inputmode="text"
            maxlength="4"
            minlength="4"
            pattern="[A-Za-z0-9]{4}"
            placeholder="ICAO"
            aria-label="ICAO kodu"
            spellcheck="false"
            required
          >
          <button type="submit">Sorgula</button>
        </div>

        <div class="weather-quick" aria-label="Hızlı havalimanı seçimi">
          <button type="button" data-weather-icao="LTAI">LTAI</button>
          <button type="button" data-weather-icao="LTFM">LTFM</button>
          <button type="button" data-weather-icao="LTAC">LTAC</button>
          <button type="button" data-weather-icao="LTBJ">LTBJ</button>
        </div>
      </form>

      <div class="weather-feedback" id="weather-feedback" aria-live="polite">
        <span class="weather-feedback-dot"></span>
        <span></span>
      </div>

      <div class="weather-results" id="weather-results" hidden>
        <article class="weather-result-card">
          <div class="weather-result-head">
            <span class="weather-type">METAR</span>
            <button class="weather-copy" type="button" data-copy-weather="metar">Copy</button>
          </div>
          <pre id="weather-metar">—</pre>
          <div class="weather-decode" id="weather-metar-decode" hidden></div>
        </article>

        <article class="weather-result-card">
          <div class="weather-result-head">
            <span class="weather-type">TAF</span>
            <button class="weather-copy" type="button" data-copy-weather="taf">Copy</button>
          </div>
          <pre id="weather-taf">—</pre>
          <div class="weather-decode" id="weather-taf-decode" hidden></div>
        </article>

        <article class="weather-interpretation" id="weather-interpretation" hidden>
          <div class="weather-interpretation-head">
            <span id="weather-interpretation-title">Hava Durumu Yorumu</span>
            <span class="weather-interpretation-mode">ALG</span>
          </div>
          <div id="weather-interpretation-content"></div>
        </article>

        <div class="weather-source-line" id="weather-source-line"></div>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="shell footer-inner">
    <span>© <span id="year-label"></span> YulCaribe</span>
  </div>
</footer>
