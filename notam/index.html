<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="YulCaribe NOTAM arama ve filtreleme ekranı.">
  <title>NOTAM | YulCaribe</title>
  <link rel="stylesheet" href="/main/app.css?v=1">
</head>
<body data-page="notam">
  <header class="app-header">
    <a class="app-brand" href="/main/">YulCaribe</a>
  </header>

  <main class="app-main notam-main">
    <section class="notam-toolbar" aria-labelledby="notam-title">
      <div class="section-title-row">
        <h1 id="notam-title">NOTAM</h1>
        <span id="source-state" class="source-line">FAA NMS</span>
      </div>

      <div class="filter-grid" aria-label="NOTAM filtreleri">
        <label><span>Arama</span><input id="f-q" type="search" placeholder="NOTAM no, metin…"></label>
        <label><span>ICAO</span><input id="f-icao" maxlength="4" placeholder="LTAI"></label>
        <label><span>FIR</span><input id="f-fir" maxlength="4" placeholder="LTAA"></label>
        <label><span>Zaman durumu</span><select id="f-state"><option value="valid">Geçerli</option><option value="future">Gelecek</option><option value="expired">Geçmiş</option><option value="cancelled">İptal</option><option value="all">Tümü</option></select></label>
        <label><span>UTC</span><input id="f-at" type="datetime-local" step="60"></label>
        <label><span>Tip</span><select id="f-type"><option value="">Tümü</option></select></label>
        <label><span>Classification</span><select id="f-classification"><option value="">Tümü</option></select></label>
        <label><span>Scope</span><select id="f-scope"><option value="">Tümü</option></select></label>
        <label><span>Traffic</span><select id="f-traffic"><option value="">Tümü</option></select></label>
        <label><span>Purpose</span><input id="f-purpose" maxlength="12" placeholder="NBOM"></label>
        <label><span>Q / Selection</span><input id="f-selection" maxlength="12" placeholder="QMRLC"></label>
        <label><span>Sıralama</span><select id="f-sort"><option value="updated_desc">Son güncellenen</option><option value="start_desc">Başlangıç yeni → eski</option><option value="start_asc">Başlangıç eski → yeni</option><option value="ident">NOTAM numarası</option></select></label>
        <label><span>Sayfa boyutu</span><select id="f-limit"><option value="25">25</option><option value="50" selected>50</option><option value="100">100</option><option value="200">200</option></select></label>
      </div>

      <div class="filter-actions">
        <button id="apply" type="button">Filtrele</button>
        <button id="reset" type="button">Sıfırla</button>
      </div>
    </section>

    <section class="result-summary">
      <div><strong id="result-count">—</strong> <span id="result-label">NOTAM</span></div>
      <span id="status">Hazırlanıyor…</span>
    </section>

    <section id="results" class="results" aria-live="polite"></section>

    <nav class="pager" aria-label="Sayfalama">
      <button id="prev" type="button">← Önceki</button>
      <span id="page-info">—</span>
      <button id="next" type="button">Sonraki →</button>
    </nav>
  </main>

  <nav class="bottom-nav" aria-label="Ana navigasyon">
    <a href="/main/" data-nav="home">HOME</a>
    <a href="/main/map/" data-nav="map">MAP</a>
    <a href="/main/notam/" data-nav="notam" aria-current="page">NOTAM</a>
  </nav>

  <script src="/main/app.js?v=1" defer></script>
</body>
</html>
