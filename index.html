<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="YulCaribe aviation tools: METAR, TAF, NOTAM, navigation map, WAFS and live aircraft.">
  <title>YulCaribe</title>
  <link rel="stylesheet" href="/main/app.css?v=3">
</head>
<body data-page="home">
  <header class="app-header">
    <a class="app-brand" href="/main/">YulCaribe</a>
  </header>

  <main class="app-main home-main">
    <section class="page-section weather-tool" aria-labelledby="weather-title">
      <div class="section-title-row">
        <h1 id="weather-title">METAR / TAF</h1>
      </div>

      <form id="weather-search-form" class="search-row" autocomplete="off">
        <input id="weather-stations" name="stations" type="text" inputmode="text" maxlength="100" placeholder="ICAO / IATA · ör. LTAI AYT LTFM" aria-label="ICAO veya IATA kodları" spellcheck="false" required>
        <button id="weather-search-submit" type="submit">Sorgula</button>
      </form>

      <div class="weather-query-options" role="group" aria-label="Weather products">
        <label><input id="weather-type-metar" type="checkbox" checked> <span>METAR</span></label>
        <label><input id="weather-type-taf" type="checkbox" checked> <span>TAF</span></label>
      </div>

      <div class="quick-row" aria-label="Hızlı havalimanı seçimi">
        <button type="button" data-weather-code="LTAI">LTAI</button>
        <button type="button" data-weather-code="LTFM">LTFM</button>
        <button type="button" data-weather-code="LTAC">LTAC</button>
        <button type="button" data-weather-code="LTBJ">LTBJ</button>
      </div>

      <div id="weather-feedback" class="status-line" aria-live="polite"></div>

      <div id="weather-results" class="weather-results" hidden>
        <div class="weather-result-actions">
          <button id="weather-copy" type="button">Kopyala</button>
          <button id="weather-share" type="button">Paylaş</button>
        </div>
        <section id="weather-raw" class="weather-raw" aria-label="Raw weather data"></section>
        <section id="weather-decoded" class="weather-decoded" aria-label="Decoded weather data" hidden></section>
        <div id="weather-source-line" class="source-line"></div>
      </div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Ana navigasyon">
    <a href="/main/" data-nav="home" aria-current="page">HOME</a>
    <a href="/main/map/" data-nav="map">MAP</a>
    <a href="/main/notam/" data-nav="notam">NOTAM</a>
  </nav>

  <script src="/main/i18n.js?v=1" defer></script>
  <script src="/main/app.js?v=3" defer></script>
</body>
</html>
