<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07131f">
  <meta name="description" content="Yulcaribe Aviation canlı uçuş haritası">
  <title>Canlı Uçuş Haritası | Yulcaribe Aviation</title>

  <style>
    html,body,#map{width:100%;height:100%;margin:0}
    body{overflow:hidden;background:#07131f;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #map{position:fixed;inset:0;z-index:1}
    #boot-status{position:fixed;z-index:9999;inset:0;display:grid;place-items:center;background:#07131f;color:#eef6fb;text-align:center;padding:24px}
    #boot-status small{display:block;margin-top:8px;color:#94a9b9}
    #boot-status.hidden{display:none}
  </style>

  <link id="leaflet-css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/main/map/map.css">
</head>

<body data-theme="night">
  <div id="map" aria-label="Canlı uçuş haritası"></div>

  <div id="boot-status">
    <div>
      <strong>Harita yükleniyor…</strong>
      <small id="boot-detail">Leaflet başlatılıyor</small>
    </div>
  </div>

  <header class="map-header">
    <a class="back-button" href="/" aria-label="Ana sayfaya dön">←</a>

    <div class="map-brand">
      <strong>Yulcaribe Aviation</strong>
      <span>Live Flight Map</span>
    </div>

    <div class="header-spacer"></div>

    <div class="search-wrap">
      <input id="flight-search" type="search" autocomplete="off"
             placeholder="Uçuş / tescil / ICAO ara"
             aria-label="Uçuş ara">
    </div>

  </header>

  <aside class="status-panel">
    <div class="status-item">
      <span class="status-dot" id="feed-dot"></span>
      <div><small>CANLI</small><strong id="aircraft-count">0 uçak</strong></div>
    </div>
    <div class="status-separator"></div>
    <div class="status-item compact">
      <div><small>KAYNAK</small><strong id="source-label">Bağlanıyor…</strong></div>
    </div>
    <div class="status-separator desktop-only"></div>
    <div class="status-item compact desktop-only">
      <div><small>GÜNCELLEME</small><strong id="update-label">—</strong></div>
    </div>
  </aside>

  <button id="options-toggle" class="options-toggle" type="button" aria-expanded="false" aria-controls="options-panel">
    ⚙ <span>Options</span>
  </button>

  <section id="options-panel" class="options-panel" aria-hidden="true">
    <div class="options-head">
      <div>
        <strong>Harita Ayarları</strong>
        <small>Görünümü sana göre ayarla</small>
      </div>
      <button id="options-close" type="button" aria-label="Ayarları kapat">×</button>
    </div>

    <div class="option-group">
      <span class="option-label">Harita modu</span>
      <div class="segmented">
        <button type="button" data-theme-value="day">☀ Gündüz</button>
        <button type="button" data-theme-value="night">☾ Gece</button>
      </div>
    </div>

    <div class="option-group">
      <span class="option-label">Uçak boyutu</span>
      <div class="segmented three">
        <button type="button" data-size-value="small">Küçük</button>
        <button type="button" data-size-value="medium">Orta</button>
        <button type="button" data-size-value="large">Büyük</button>
      </div>
    </div>
  </section>

  <div class="map-hint" id="map-hint">Haritayı taşıdığında o bölgedeki uçaklar yüklenir.</div>

  <script>
    (function () {
      const detail = document.getElementById("boot-detail");
      const status = document.getElementById("boot-status");

      const leafletSources = [
        "https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js",
        "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js",
        "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      ];

      function loadScript(src) {
        return new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = src;
          script.async = true;
          script.onload = resolve;
          script.onerror = reject;
          document.head.appendChild(script);
        });
      }

      async function boot() {
        let loaded = false;

        for (const src of leafletSources) {
          try {
            detail.textContent = "Harita motoru yükleniyor…";
            await loadScript(src);
            if (window.L) {
              loaded = true;
              break;
            }
          } catch (e) {
            console.warn("Leaflet CDN yüklenemedi:", src, e);
          }
        }

        if (!loaded) {
          status.innerHTML =
            '<div><strong>Harita motoru yüklenemedi</strong><small>Leaflet CDN bağlantıları engelleniyor.</small></div>';
          return;
        }

        try {
          detail.textContent = "Harita hazırlanıyor…";
          await loadScript("/main/map/map.js");

          setTimeout(() => {
            if (document.querySelector(".leaflet-container")) {
              status.classList.add("hidden");
            } else {
              status.innerHTML =
                '<div><strong>Harita başlatılamadı</strong><small>map.js çalıştı ancak Leaflet haritası oluşmadı.</small></div>';
            }
          }, 300);
        } catch (e) {
          console.error(e);
          status.innerHTML =
            '<div><strong>Harita kodu yüklenemedi</strong><small>/main/map/map.js erişimini kontrol et.</small></div>';
        }
      }

      boot();
    })();
  </script>
</body>
</html>
