name: Build Sheets MicroG APK

on:
  workflow_dispatch:
  push:
    branches:
      - tmp-sheets-microg-build
    paths:
      - '.github/workflows/build-sheets-microg.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download Morphe Desktop
        shell: bash
        run: |
          set -euo pipefail
          URL=$(curl -fsSL https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest | jq -r '.assets[] | select(.name | endswith("-all.jar")) | .browser_download_url' | head -n1)
          curl -fL "$URL" -o morphe.jar
          java -jar morphe.jar --version

      - name: Download exact Google Sheets APK
        shell: bash
        run: |
          set -euo pipefail
          APKEEP_URL=$(curl -fsSL https://api.github.com/repos/EFForg/apkeep/releases/latest | jq -r '.assets[] | select(.name=="apkeep-x86_64-unknown-linux-gnu") | .browser_download_url')
          curl -fL "$APKEEP_URL" -o apkeep
          chmod +x apkeep
          ./apkeep --version
          ./apkeep -l -a com.google.android.apps.docs.editors.sheets -d apk-pure || true
          mkdir -p apkout
          ./apkeep \
            -a 'com.google.android.apps.docs.editors.sheets@1.26.391.02.90' \
            -d apk-pure \
            -o 'acknowledge_dangers=true,arch=arm64-v8a;armeabi-v7a;armeabi;x86;x86_64' \
            apkout
          find apkout -maxdepth 1 -type f -print -exec ls -lh {} \;
          APK=$(find apkout -maxdepth 1 -type f -name '*.apk' | head -n1)
          test -n "$APK"
          cp "$APK" sheets.apk
          sha256sum sheets.apk
          test "$(head -c2 sheets.apk)" = "PK"
          test $(stat -c%s sheets.apk) -gt 100000000

      - name: Patch for Morphe MicroG RE
        shell: bash
        run: |
          set -euo pipefail
          java -jar morphe.jar patch \
            --exclusive \
            -p https://github.com/MorpheApp/morphe-patches \
              -e "Clone app" \
                -O packageName=com.google.android.apps.docs.editors.sheets.morphe \
                -O updatePermissions=false \
                -O updateProviders=false \
            -p https://github.com/rushiranpise/morphe-patches \
              -e "Provide Original app certificate" \
              -e "GmsCore support (MicroG)" \
                -O gmsCoreVendor=app.revanced.android.gms \
                -O packageName=com.google.android.apps.docs.editors.sheets.morphe \
            --bytecode-mode FULL \
            -o Google-Sheets-Morphe-MicroG.apk \
            sheets.apk
          test -s Google-Sheets-Morphe-MicroG.apk
          sha256sum Google-Sheets-Morphe-MicroG.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Google-Sheets-Morphe-MicroG
          path: Google-Sheets-Morphe-MicroG.apk
          if-no-files-found: error
          retention-days: 1
