name: Build Sheets MicroG APK

on:
  workflow_dispatch:
  push:
    branches:
      - tmp-sheets-microg-build
    paths:
      - '.github/workflows/build-sheets-microg.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download Morphe Desktop
        shell: bash
        run: |
          set -euo pipefail
          URL=$(curl -fsSL https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest | jq -r '.assets[] | select(.name | endswith("-all.jar")) | .browser_download_url' | head -n1)
          curl -fL "$URL" -o morphe.jar
          java -jar morphe.jar --version

      - name: Download exact Google Sheets
        shell: bash
        run: |
          set -euo pipefail
          APKEEP_URL=$(curl -fsSL https://api.github.com/repos/EFForg/apkeep/releases/latest | jq -r '.assets[] | select(.name=="apkeep-x86_64-unknown-linux-gnu") | .browser_download_url')
          curl -fL "$APKEEP_URL" -o apkeep
          chmod +x apkeep
          mkdir -p apkout
          ./apkeep \
            -a 'com.google.android.apps.docs.editors.sheets@1.26.391.02.90' \
            -d apk-pure \
            -o 'acknowledge_dangers=true,arch=arm64-v8a;armeabi-v7a;armeabi;x86;x86_64' \
            apkout
          INPUT=$(find apkout -maxdepth 1 -type f \( -name '*.apk' -o -name '*.xapk' \) | head -n1)
          test -n "$INPUT"
          cp "$INPUT" sheets-input.xapk
          ls -lh sheets-input.xapk
          sha256sum sheets-input.xapk

      - name: Patch for Morphe MicroG RE
        shell: bash
        run: |
          set -euo pipefail
          java -jar morphe.jar patch \
            --exclusive \
            -p https://github.com/MorpheApp/morphe-patches \
              -e "Clone app" \
                -O packageName=com.google.android.apps.docs.editors.sheets.morphe \
                -O updatePermissions=true \
                -O updateProviders=true \
            -p https://github.com/rushiranpise/morphe-patches \
              -e "Provide Original app certificate" \
              -e "GmsCore support (MicroG)" \
                -O gmsCoreVendor=app.revanced.android.gms \
            --bytecode-mode FULL \
            -o Google-Sheets-Morphe-MicroG.apk \
            sheets-input.xapk
          test -s Google-Sheets-Morphe-MicroG.apk
          ls -lh Google-Sheets-Morphe-MicroG.apk
          sha256sum Google-Sheets-Morphe-MicroG.apk

      - name: Fix MicroG RE account type
        shell: bash
        run: |
          set -euo pipefail
          curl -fL https://raw.githubusercontent.com/yulcaribe/main/tmp-sheets-microg-build/tmp_tools/fix_sheets_manifest.py -o /tmp/fix_sheets_manifest.py\n          python /tmp/fix_sheets_manifest.py Google-Sheets-Morphe-MicroG.apk Google-Sheets-Morphe-MicroG-v2-unsigned.apk
          curl -fL https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -o signer.jar
          mkdir -p signed
          java -jar signer.jar --apks Google-Sheets-Morphe-MicroG-v2-unsigned.apk --allowResign --out signed
          FINAL=$(find signed -maxdepth 1 -type f -name '*.apk' | head -n1)
          test -n "$FINAL"
          cp "$FINAL" Google-Sheets-Morphe-MicroG-v2.apk
          sha256sum Google-Sheets-Morphe-MicroG-v2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Google-Sheets-Morphe-MicroG-v2
          path: Google-Sheets-Morphe-MicroG-v2.apk
          if-no-files-found: error
          retention-days: 1
